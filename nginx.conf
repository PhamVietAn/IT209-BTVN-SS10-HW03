server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # API trạng thái tĩnh cho ứng dụng React.
    location = /api/health {
        default_type application/json;
        try_files /api/health.json =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
